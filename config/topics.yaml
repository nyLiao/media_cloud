media_cloud:
  api_key_env: MC_API_TOKEN
  platform: onlinenews-mediacloud
  window_days: 5000
  # mediacloud 5.1.0 supports page_size; the server-side maximum is not yet documented.
  page_size: 1000
  max_pages_per_window: 50
  timeout_s: 300
  max_retries: 0

fetch:
  user_agent: "media-cloud-research/0.1 (+mailto:you@example.org)"
  per_domain_delay_s: 3.0
  global_max_rps: 2.0
  timeout_s: 30
  max_retries: 0
  respect_robots: true
  wayback_fallback: false
  min_text_chars: 500
  save_raw_html: true

llm:
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  model: "glm-5"
  timeout_s: 300
  max_requests_per_min: 30
  articles_per_request: 5
  max_article_chars: 12000
  max_output_tokens: 4000
  temperature: 0
  structured_output: json_schema
  prompt_version: v1

topics:
  revolving_door_ca:
    label: "Revolving Door (Canada)"
    # Written to cases.link_category and the CSV; not asked of the model.
    link_category: "Revolving Door"
    query: >-
      "revolving door" OR
      ((lobbyist* OR "lobbying firm*" OR lobby) AND
      ("public sector" OR "civil serv*" OR "public office" OR
      "former minister*" OR "former official*" OR parliament*))
    start_date: 2021-01-01
    end_date: 2025-12-31
    collection_ids: [34411583]
    languages: [en]
    # An empty allowlist disables an additional domain filter. The collection scopes sources.
    domain_allowlist: []
    qc:
      min_title_chars: 20
      exclude_url_patterns: ["/video/", "/live/", "/sports/", "/photo", "/tag/"]
    extraction:
      unit: person_transition
      relevance_criteria: >-
        The article must explicitly report a high-confidence transition between a
        public-sector organization and a private organization.
      exactly_one_of: [person_name, cohort_name]
      fields:
        - name: person_name
          type: string
          required: false
          description: "Full name of the individual; null for cohort findings."
        - name: cohort_name
          type: string
          required: false
          description: "Short descriptive name for a cohort finding; null for individuals."
        - name: private_org
          type: string
          required: true
          description: "Private organization explicitly involved in the transition."
        - name: private_time
          type: string
          required: false
          description: "Explicit time associated with the private role; null if unstated."
        - name: public_org
          type: string
          required: true
          description: "Public-sector organization explicitly involved in the transition."
        - name: public_time
          type: string
          required: false
          description: "Explicit time associated with the public role; null if unstated."
        - name: jurisdiction
          type: string
          required: true
          description: "Jurisdiction explicitly associated with the transition."
