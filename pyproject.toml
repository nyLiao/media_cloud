[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-cloud-pipeline"
version = "0.1.0"
description = "Reproducible Media Cloud search-to-CSV research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mediacloud==5.1.0",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
mc-pipeline = "mc_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mc_pipeline"]
